services:
  - type: web
    name: auto-reaction-bot
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WORKER_COUNT
        value: 2
      - key: LOG_LEVEL
        value: INFO
